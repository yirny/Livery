; Livery palette: Norden, after Norden UI (a SkyUI interface by Nithog).
; A muted monochrome: grey #333333 panels, lighter greys for rows and the accent.
;
; A palette holds the colours of Livery's Modern skin. Pick one in SKSE Menu Framework's
; Livery page, or in Livery.ini's [UI] Palette by its file name without .ini.
;
; To make your own, copy this file in this folder under a new name and change its colours;
; it is listed the next time the game starts. Each colour is #RRGGBB or #RRGGBBAA, where AA
; is the opacity (00 clear, FF opaque). A colour left out or written otherwise keeps Edge's.

[Palette]
; The window.
Window=#333333F0
; Popups, dropdown lists and tooltips.
Surface=#3A3A3AFA
; The title bars of the window and its popups.
TitleBar=#2A2A2AFF
; Text.
Text=#E6E6E6FF
; Field and column labels, list headings, links and greyed text.
Label=#9A9A9AFF
; Ticks, a selected row's rule, a link or label under the mouse, the dropdown arrow, the frame of a field that narrows a list.
Accent=#D0D0D0FF
; The text cursor, a scroll bar or slider held.
AccentLight=#FFFFFFFF
; The rules and frames of the window, its fields and lists.
Rule=#555555FF
; A row under the mouse.
Hover=#444444FF
; A selected row, the selected tab, the fill of a field that narrows a list.
Selected=#4A4A4AFF
; Error text and fields.
Error=#FF6666FF
